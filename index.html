<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crawl Space Pros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">

      <a class="brand" href="#" aria-label="Crawl Space Pros home">
        <img
          class="brand-logo"
          src="b9c34fec-3561-472c-8195-e6789ea01a0d.png"
          alt="Crawl Space Pros"
        >
      </a>

      <!-- Desktop only -->
      <a class="header-cta desktop-quote" href="#quote">
        Get Quote
      </a>

      <!-- Mobile only -->
      <button
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="mobileMenu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Empty shell for the links we'll add later -->
      <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
        <div class="mobile-menu-inner">
          <!-- Navigation links will go here as we build the page -->
        </div>
      </div>

    </div>
  </header>

  <script src="script.js"></script>
</body>
</html>
