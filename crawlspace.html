<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crawl Space Pros</title>

  <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/policypal1/crawlspace@76bbd0d19aaac5956c4bb5dbecc7d00f383407ba/b9c34fec-3561-472c-8195-e6789ea01a0d.png">
  <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/policypal1/crawlspace@76bbd0d19aaac5956c4bb5dbecc7d00f383407ba/b9c34fec-3561-472c-8195-e6789ea01a0d.png">

  <style>
    :root{
      --navy:#031229;
      --blue:#1A5A97;
      --blue-hover:#124a80;
      --white:#ffffff;
      --border:#dce6ef;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:#fff;
      color:var(--navy);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{min-height:100vh}

    .site-header{
      position:sticky;
      top:0;
      z-index:1000;
      width:100%;
      background:rgba(255,255,255,.98);
      border-bottom:1px solid var(--border);
      box-shadow:0 4px 18px rgba(3,18,41,.06);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .header-inner{
      width:min(1180px,calc(100% - 48px));
      min-height:82px;
      margin:0 auto;
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:32px;
    }

    .brand{
      display:inline-flex;
      align-items:center;
      text-decoration:none;
      min-width:0;
    }

    .brand-logo{
      display:block;
      width:auto;
      height:58px;
      max-width:230px;
      object-fit:contain;
    }

    .desktop-nav{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:28px;
    }

    .desktop-nav a{
      color:var(--navy);
      text-decoration:none;
      font-size:14px;
      line-height:1;
      font-weight:800;
      transition:color .18s ease;
    }

    .desktop-nav a:hover,
    .desktop-nav a:focus-visible{
      color:var(--blue);
    }

    .header-cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:0 21px;
      border-radius:8px;
      background:var(--blue);
      color:#fff;
      text-decoration:none;
      font-size:13px;
      line-height:1;
      font-weight:900;
      white-space:nowrap;
      box-shadow:0 8px 20px rgba(26,90,151,.18);
      transition:background .18s ease,transform .18s ease;
    }

    .header-cta:hover,
    .header-cta:focus-visible{
      background:var(--blue-hover);
      transform:translateY(-1px);
    }

    .mobile-call{display:none}

    @media(max-width:700px){
      .site-header{
        box-shadow:0 3px 14px rgba(3,18,41,.07);
      }

      .header-inner{
        width:calc(100% - 28px);
        min-height:70px;
        grid-template-columns:minmax(0,1fr) auto;
        gap:14px;
      }

      .brand-logo{
        height:48px;
        max-width:190px;
      }

      .desktop-nav,
      .desktop-quote{
        display:none;
      }

      .mobile-call{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        min-height:46px;
        padding:0 18px;
        border-radius:8px;
        background:var(--blue);
        color:#fff;
        text-decoration:none;
        font-size:13px;
        line-height:1;
        font-weight:900;
        white-space:nowrap;
        box-shadow:0 7px 18px rgba(26,90,151,.20);
      }

      .mobile-call:active{
        transform:translateY(1px);
      }
    }

    @media(max-width:380px){
      .header-inner{
        width:calc(100% - 20px);
        gap:10px;
      }

      .brand-logo{
        height:43px;
        max-width:160px;
      }

      .mobile-call{
        min-height:44px;
        padding:0 14px;
        font-size:12px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Crawl Space Pros home">
        <img
          class="brand-logo"
          src="https://cdn.jsdelivr.net/gh/policypal1/crawlspace@76bbd0d19aaac5956c4bb5dbecc7d00f383407ba/Crawlspace-Logo-01.webp"
          alt="Crawl Space Pros"
        >
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="#cleanouts">Cleanouts</a>
        <a href="#what-we-remove">What We Remove</a>
        <a href="#how-it-works">How It Works</a>
        <a href="#projects">Projects</a>
        <a href="#why-us">Why Us</a>
      </nav>

      <a class="header-cta desktop-quote" href="#quote">Free Estimate</a>

      <a class="mobile-call" href="tel:3604704956" aria-label="Call Crawl Space Pros now">
        Call Now
      </a>
    </div>
  </header>
</body>
</html>
